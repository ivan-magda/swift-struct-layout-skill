<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="struct-layout-title struct-layout-desc">
<title id="struct-layout-title">Same fields, smaller element slots</title>
<desc id="struct-layout-desc">Reordering two Boolean flags and an Int64 reduces the measured size from 17 to 10 bytes and the stride from 24 to 16 bytes, with alignment 8, on Swift 6.4 arm64 macOS.</desc>
<defs>
  <pattern id="internal-padding" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e5e7eb"/>
    <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#9ca3af" stroke-width="1"/>
  </pattern>
  <pattern id="tail-padding" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#f3f4f6"/>
    <circle cx="4" cy="4" r="1" fill="#6b7280"/>
  </pattern>
</defs>
